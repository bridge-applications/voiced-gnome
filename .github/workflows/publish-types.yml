name: Publish types
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voiced-gnome-types-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@bridge-applications'
      - run: npm ci
      - run: npm run check
      - run: npm run types:check
      - run: npm run format:check
      - run: npm publish --workspace @bridge-applications/voiced-gnome-types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
